<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de bon VTC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  font-size: 18px;
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.primary {
  background: #2563eb;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #111827;
}

.success {
  background: #16a34a;
  color: white;
}

.status {
  padding: 12px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1d4ed8;
  margin-top: 10px;
}

.hidden {
  display: none;
}

.bon {
  position: relative;
  background: white;
  padding: 25px;
  border: 1px solid #ddd;
}

.watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);
  font-size: 38px;
  color: rgba(220, 38, 38, .12);
  font-weight: bold;
  pointer-events: none;
  white-space: nowrap;
}

.bon-header {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  border-bottom: 2px solid #111827;
  padding-bottom: 15px;
}

.info {
  margin-top: 20px;
}

.row {
  display: flex;
  border-bottom: 1px solid #eee;
  padding: 10px 0;
  gap: 10px;
}

.row strong {
  min-width: 145px;
}

.total {
  font-size: 21px;
  font-weight: bold;
  text-align: right;
  margin-top: 20px;
}

@media print {
  body {
    background: white;
  }

  header,
  .no-print {
    display: none !important;
  }

  .container {
